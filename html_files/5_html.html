<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Example 5: Far Far</title>
  <link rel="stylesheet" href="../app/pip.css">
  <script src="../app/pip.js" defer></script>
  <script src="../app/mcgurk.js" defer></script>
</head>
<body>
  <main>
    <div class="pip-layout" data-example="5">
      <h1 class="pip-title">Example 5: Far Far (McGurk Illusion)</h1>
      <div class="pip-help"></div>
      <div class="pip-stage"></div>
      <aside class="pip-instructions">
        <h2 class="pip-instructions-title">Instructions</h2>
        <ol>
          <li>Pick a speaker, then press <strong>Run</strong>.</li>
          <li>Listen first with the video on, then toggle <strong>Show Video</strong> off to hear the unaltered sound.</li>
          <li>Use <strong>Change Audio</strong> to swap recordings, and <strong>Restart</strong> if playback drifts.</li>
        </ol>
        <p class="pip-nav-note">Click Home to return to the examples list.</p>
      </aside>
      <nav class="pip-nav"></nav>
    </div>
  </main>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      pipMcgurkSketch({
        speakers: [
          { name: "Stella",   video: "../assets/5_far_v0.mp4", correctAudio: "../assets/5_farfar_aCorrect0.mp3", wrongAudio: "../assets/5_farfar_aWrong0.mp3" },
          { name: "Meredith", video: "../assets/5_far_v1.mp4", correctAudio: "../assets/5_farfar_aCorrect1.mp3", wrongAudio: "../assets/5_farfar_aWrong1.mp3" },
        ],
        words: ["Actual audio: “Bar Bar Bar”", "Actual audio: “Far Far Far”"],
      });
    });
  </script>
</body>
</html>
